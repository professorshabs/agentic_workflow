# Hybrid local-first harness profile for macOS builds:
#   - Parser & Researcher: Google Antigravity CLI (`agy`, fallback to `ModelRouter`)
#   - Judge: Claude Code (`claude`, Opus 5.5, strictly read-only)
#   - E2E contract: Claude Code (`claude`, Sonnet, `--effort high`, strictly read-only, fallback OpenRouter)
#   - Dual Post-Build Supervisor: Claude Opus (`claude_code`) + Gemini 4 Neon (`agy`, fallback OpenRouter)
#   - Builder: Gemma 4 12B on this Mac (LM Studio or Ollama) via the Antigravity Python SDK
#     (`LocalOpenAIAgentConfig.lightweight()`). If the 12B can't finish (not loaded, error,
#     timeout, no progress for `stall_seconds`, or no files written), the build is offloaded
#     to Claude Sonnet (`claude_code`, subscription), then Gemini 4 Hydrogen (`agy`), then
#     Claude Sonnet on OpenRouter only if those harnesses fail.
#   - Rule: every harness stage falls back to OpenRouter (`fallback: router`) if it fails.
#   - Fixer: Claude Sonnet (`claude_code`, subscription) and Gemini 4 Hydrogen (`agy`) alternating
#     by round, each falling back to OpenRouter on error.
#
# Usage:
#   atlas doctor --config config/harness.yaml
#   atlas detect-local --config config/harness.yaml
#   atlas run specs/example-app.md --config config/harness.yaml

roles:
  parser: [openrouter/google/gemini-4-hydrogen]
  researcher: [openrouter/google/gemini-4-neon]
  judge: [openrouter/anthropic/claude-opus-5.5]
  e2e: [openrouter/anthropic/claude-sonnet-5.5]
  supervisor: [openrouter/google/gemini-4-neon]
  builder: [openrouter/anthropic/claude-sonnet-5.5]
  fixer: [openrouter/anthropic/claude-sonnet-5.5]

role_fallbacks:
  parser: [gemini/gemini-4-hydrogen]
  researcher: [gemini/gemini-4-neon]
  judge: [openrouter/anthropic/claude-opus-5]
  e2e: [openrouter/google/gemini-4-neon, openrouter/google/gemini-4-hydrogen, gemini/gemini-4-neon]
  supervisor: [gemini/gemini-4-neon]
  builder: [openrouter/google/gemini-4-hydrogen, gemini/gemini-4-hydrogen]
  fixer: [openrouter/google/gemini-4-hydrogen, openrouter/anthropic/claude-sonnet-5.5, gemini/gemini-4-hydrogen]

fallbacks: []

backends:
  parser:
    type: harness
    provider: antigravity
    model: gemini-4-hydrogen-high
    timeout_seconds: 180
    fallback: router

  researcher:
    type: harness
    provider: antigravity
    model: gemini-4-neon-high
    timeout_seconds: 420
    max_parallel: 3
    fallback: router

  judge:
    type: harness
    provider: claude_code
    model: opus
    read_only: true
    auth: subscription
    max_budget_usd: 1.50
    timeout_seconds: 300
    fallback: router                  # -> roles.judge on OpenRouter if `claude` fails

  e2e:
    type: harness
    provider: claude_code
    model: sonnet
    effort: high
    read_only: true
    auth: subscription
    max_budget_usd: 2.00
    timeout_seconds: 600
    fallback: router                  # -> roles.e2e on OpenRouter if `claude` fails

  supervisor:
    enabled: true
    mode: unanimous                   # unanimous | any_approve
    reviewers:
      - name: opus
        type: harness
        provider: claude_code
        model: opus
        tools: [Read, Grep, Glob]
        auth: subscription
        max_budget_usd: 1.50
        timeout_seconds: 300
        fallback: router
        router_model: openrouter/anthropic/claude-opus-5.5
      - name: neon
        type: harness
        provider: antigravity
        model: gemini-4-neon-high
        timeout_seconds: 300
        fallback: router
        router_model: openrouter/google/gemini-4-neon
        # Or set `type: openrouter` + `model: openrouter/google/gemini-4-neon` directly.

  builder:
    type: local_harness
    local_harness: local_openai       # native Python tool-loop (antigravity_sdk also supported)
    local_providers:
      lm_studio: http://localhost:1234/v1
      ollama: http://localhost:11434/v1
    local_model: null                 # or pin one, e.g. google/gemma-4-12b-qat
    # Gemma 4 12B only, first match wins: LM Studio, then Ollama. Nothing else is tried
    # (only_preferred), and nothing over 14B parameters is ever picked, so the 26B can stay
    # installed without being used.
    preferred:
      - google/gemma-4-12b-qat
      - gemma4:12b-mlx
      - gemma4:12b
    only_preferred: true
    max_parameter_size_b: 14
    require_tools: true
    min_context_tokens: 49152         # checked against what the server actually loaded
    memory_budget_fraction: 0.70
    require_tool_smoke_check: true
    smoke_timeout_seconds: 90         # includes loading the model
    timeout_seconds: 900              # whole local build; then offload
    stall_seconds: 420                # no file written for 7 min -> offload
    brief_max_chars: 24000            # BUILD_BRIEF.md (~6K tokens) instead of the ~30K-token PLAN.md
    allow_shell: false                # file tools only; true gives it run_command (Cwd inside the folder)
    sandbox: true                     # OS sandbox for run_command when allow_shell is true
    reasoning_effort: none            # stops 12B thinking spirals; null keeps server default
    max_completion_tokens: 4096       # per-turn output cap (~135s max at 30 tok/s)
    max_turns: 24                     # tool-call turn limit for local_openai
    offload:
      - name: sonnet
        type: harness
        provider: claude_code
        model: sonnet
        auth: subscription
        max_budget_usd: 5.00
        timeout_seconds: 900
      - name: hydrogen
        type: harness
        provider: antigravity
        model: gemini-4-hydrogen-high
        timeout_seconds: 900
      - name: sonnet-openrouter         # last resort when no harness can build
        type: openrouter
        model: openrouter/anthropic/claude-sonnet-5.5

  fixer:
    type: harness
    fallback: router                  # OpenRouter only if the active harness errors
    rotate:                           # round 1, 3, ...: Claude Sonnet (`claude`); round 2, 4, ...: Hydrogen (`agy`)
      - type: harness
        provider: claude_code
        model: sonnet
        read_only: true
        auth: subscription
        max_budget_usd: 2.00
        timeout_seconds: 300
        fallback: router
        router_model: openrouter/anthropic/claude-sonnet-5.5
      - type: harness
        provider: antigravity
        model: gemini-4-hydrogen-medium
        timeout_seconds: 420
        fallback: router
        router_model: openrouter/google/gemini-4-hydrogen

skills:
  sources:
    - ~/Documents/skills
    - .agents/skills
  discovery_mode: progressive
  allowlist:
    - developing-fullstack-apps
    - writing-clean-code
    - writing-ee-blogin-posts
  by_role:
    builder: [developing-fullstack-apps, writing-clean-code]
    fixer: [writing-clean-code]

# Prices for the "API-equivalent cost" estimate only (USD per 1M tokens; OpenRouter list
# prices on 2026-11-26). Calls on your Claude subscription or Google login aren't billed per
# token; this estimates what they would cost on pay-per-token APIs. Claude Code reports its
# own figure, which is used first; models missing here fall back to LiteLLM's price map.
pricing:
  sonnet: {input: 2.00, output: 10.00, cache_read: 0.10}
  opus: {input: 4.00, output: 20.00, cache_read: 0.20}
  gemini-4-hydrogen: {input: 1.50, output: 7.50, cache_read: 0.075}
  gemini-4-neon: {input: 3.00, output: 15.00, cache_read: 0.15}

limits:
  max_parallel_calls: 6
  max_tokens: 6000
  max_tokens_by_role:
    researcher: 24000
    judge: 16000
    e2e: 32000
    builder: 32000
    fixer: 48000
  timeout_seconds: 90
  timeout_seconds_by_role:
    researcher: 240
    judge: 300
    e2e: 300
    builder: 900                      # fallback timeout for builder and offload targets
    fixer: 420
  attempts_per_model: 2
  repair_attempts: 1
  max_fix_rounds: 3
  verify_timeout_seconds: 180
  max_total_tokens: null
  max_cost_usd: 2.0

limits_extra:
  max_total_tokens_per_run: null

verification:
  require_requirement_tests: true
  require_product_contract: true
  require_e2e_tests: true
