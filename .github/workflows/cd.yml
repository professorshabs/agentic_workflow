name: CD (Docker to GHCR)

on:
  workflow_call:
    inputs:
      app_slug:
        description: "Product folder slug (e.g. example-app)"
        required: true
        type: string
      artifact_name:
        description: "Workflow artifact name containing the verified product"
        required: true
        type: string
      image_tag:
        description: "Docker image tag (in addition to git short SHA)"
        required: false
        default: "latest"
        type: string

concurrency:
  group: cd-ghcr-${{ inputs.app_slug }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download verified product artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: product

      - name: Detect product and prepare Dockerfile
        id: detect
        env:
          APP_SLUG: ${{ inputs.app_slug }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9._-]{1,64}$ ]]; then
            echo "Invalid app_slug: must match ^[a-z0-9._-]{1,64}$" >&2
            exit 2
          fi

          TAG="${IMAGE_TAG_INPUT:-latest}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Invalid image_tag: must match ^[A-Za-z0-9._-]{1,64}$" >&2
            exit 2
          fi

          if [ -d "product/app/${APP_SLUG}" ]; then
            PRODUCT_DIR="product/app/${APP_SLUG}"
          elif [ -d "product/${APP_SLUG}" ]; then
            PRODUCT_DIR="product/${APP_SLUG}"
          else
            PRODUCT_DIR="product"
          fi

          if [ ! -d "$PRODUCT_DIR" ] || ! find "$PRODUCT_DIR" -mindepth 1 ! -name 'run-report.md' | grep -q .; then
            echo "No built product files found in artifact." >&2
            exit 1
          fi

          IMAGE="ghcr.io/$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')/${APP_SLUG}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          if [ -f "${PRODUCT_DIR}/Dockerfile" ]; then
            DOCKERFILE_PATH="${PRODUCT_DIR}/Dockerfile"
          elif [ -f "${PRODUCT_DIR}/pyproject.toml" ] || [ -f "${PRODUCT_DIR}/requirements.txt" ] || find "$PRODUCT_DIR" -maxdepth 3 -name '*.py' | grep -q .; then
            DOCKERFILE_PATH="/tmp/atlas.Dockerfile"
            cat > "$DOCKERFILE_PATH" <<'EOF'
          FROM python:3.12-slim
          WORKDIR /app
          COPY . /app
          RUN if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi && \
              if [ -f pyproject.toml ]; then pip install --no-cache-dir .; fi
          CMD ["python", "--version"]
          EOF
          elif [ -f "${PRODUCT_DIR}/package.json" ]; then
            DOCKERFILE_PATH="/tmp/atlas.Dockerfile"
            cat > "$DOCKERFILE_PATH" <<'EOF'
          FROM node:20-slim
          WORKDIR /app
          COPY . /app
          RUN if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
          CMD ["npm", "start"]
          EOF
          else
            echo "No Dockerfile or supported Python/Node files found to containerize." >&2
            exit 1
          fi

          {
            echo "product_dir=$PRODUCT_DIR"
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "short_sha=$SHORT_SHA"
            echo "dockerfile=$DOCKERFILE_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          PRODUCT_DIR: ${{ steps.detect.outputs.product_dir }}
          IMAGE: ${{ steps.detect.outputs.image }}
          TAG: ${{ steps.detect.outputs.tag }}
          SHORT_SHA: ${{ steps.detect.outputs.short_sha }}
          DOCKERFILE_PATH: ${{ steps.detect.outputs.dockerfile }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build -f "$DOCKERFILE_PATH" -t "${IMAGE}:${SHORT_SHA}" -t "${IMAGE}:${TAG}" "$PRODUCT_DIR"
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:${TAG}"

          {
            echo "## Docker Image Published"
            echo ""
            echo "- \`${IMAGE}:${SHORT_SHA}\`"
            echo "- \`${IMAGE}:${TAG}\`"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${TAG}"
            echo "docker run --rm ${IMAGE}:${TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
