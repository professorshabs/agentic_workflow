name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Branch to check out (used by spec-to-app.yml for the generated PR)
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/ --ignore-missing-imports
      - run: pytest
      - run: pip install pip-audit && pip-audit

  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check and verify generated app (if present)
        run: |
          if [ -d app ] && find app -mindepth 1 ! -name '.gitkeep' | grep -q .; then
            pip install -e . pytest ruff
            atlas verify --app-dir app
          else
            echo "No generated application files in app/; skipping app verification."
          fi
