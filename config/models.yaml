# Provider/model IDs must match your LiteLLM provider setup and account access.
# Primary models route through OpenRouter (OPENROUTER_API_KEY) with direct
# Google Gemini API (GEMINI_API_KEY) fallbacks. Local Ollama models use `ollama_chat/`.
roles:
  parser: [openrouter/google/gemini-4-hydrogen]
  researcher:
    - openrouter/google/gemini-4-neon
  judge: [openrouter/anthropic/claude-opus-5.5]
  e2e: [openrouter/anthropic/claude-sonnet-5.5]
  # Default builder uses OpenRouter (OPENROUTER_API_KEY).
  # Alternatives for lower-cost or local builds:
  #   - Local Gemma 4 via Ollama (local CLI only; set OLLAMA_API_BASE): [ollama_chat/gemma4:26b]
  builder: [openrouter/google/gemini-4-hydrogen]
  fixer: [openrouter/anthropic/claude-sonnet-5.5]

# Fallbacks are applied after the requested model. Add credentials for every
# provider you intend to use.
role_fallbacks:
  parser: [gemini/gemini-4-hydrogen, gemini/gemini-3.8-flash]
  researcher: [gemini/gemini-4-neon, gemini/gemini-4-hydrogen]
  judge: [openrouter/anthropic/claude-opus-5, gemini/gemini-4-neon]
  e2e: [openrouter/google/gemini-4-neon, openrouter/google/gemini-4-hydrogen, gemini/gemini-4-neon]
  builder: [gemini/gemini-4-hydrogen, gemini/gemma-4-31b-it]
  fixer: [openrouter/google/gemini-4-hydrogen, gemini/gemini-4-hydrogen]

# Last-resort fallbacks if a role has no specific fallback configured.
fallbacks: []

limits:
  max_parallel_calls: 6
  max_tokens: 6000
  # Output limits per role (fall back to max_tokens). The builder returns the whole app,
  # tests and README in one reply, and the fixer returns full files, so they need more.
  max_tokens_by_role:
    researcher: 12000
    judge: 16000
    e2e: 16000
    builder: 32000
    fixer: 32000
  timeout_seconds: 90
  # Long replies take minutes to generate; give those roles more time (fall back to above).
  timeout_seconds_by_role:
    researcher: 180
    judge: 300
    e2e: 300
    builder: 600
    fixer: 300
  attempts_per_model: 2
  repair_attempts: 1
  max_fix_rounds: 3
  verify_timeout_seconds: 180
  # Optional hard caps to prevent runaway spend (null = unlimited):
  max_total_tokens: null
  max_cost_usd: 2.0  # Per-run USD safety cap; set to null for unlimited

verification:
  # Fail verification (and send it to the fixer) when a functional requirement from the
  # parsed spec has no test file mentioning its ID, e.g. "R002".
  require_requirement_tests: true
